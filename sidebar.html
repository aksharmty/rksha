<button id="continueBtn">
    Continue
</button>

<script>
(function(){

    const SMARTLINK =
    "https://www.profitablecpmratenetwork.com/ka9w8m66?key=9ef4829d333930832621abd4b2481d67";

    const DESTINATION =
    "https://rajkumarspiritualhealing.adquash.com/service.html";

    const KEY_TIME = "smartlink_time";
    const COOLDOWN = 30 * 60 * 1000; // 30 min

    const btn = document.getElementById("continueBtn");

    function shouldShowAd(){

        const lastTime = localStorage.getItem(KEY_TIME);

        if(!lastTime) return true;

        return (Date.now() - parseInt(lastTime)) > COOLDOWN;
    }

    btn.addEventListener("click", function(){

        // Show ad only after cooldown
        if(shouldShowAd()){

            localStorage.setItem(KEY_TIME, Date.now());

            // Open smartlink in new tab
            const adWindow = window.open(
                SMARTLINK,
                "_blank"
            );

            // Optional focus handling
            if(adWindow){
                adWindow.blur();
                window.focus();
            }
        }

        // Open actual content in same tab
        window.location.href = DESTINATION;

    });

})();
</script>
